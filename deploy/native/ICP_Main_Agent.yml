        x: 3300
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 确认后准备分支
        code_language: python3
        code: "import json\ndef main(function_id: str, candidates: str, query: str):\n\
          \ located=json.loads(candidates)\n function=next(r for r in located['data']\
          \ if r['id']==function_id)\n out={'function':json.dumps(function,ensure_ascii=False),'version':located['corpus_version']}\n\
          \ for n in ['FTA_Query','FMECA_Query','RBD_Query','Fault_History_Query']:\n\
          \  q=function_id if n in ['FTA_Query','RBD_Query'] else query\n  out[n]=json.dumps({'input':json.dumps({'query':q,'function_id':function_id},ensure_ascii=False)},ensure_ascii=False)\n\
          \ return out\n"
        variables:
        - variable: function_id
          value_selector:
          - diag_confirm
          - function_id
        - variable: candidates
          value_selector:
          - diag_located
          - candidates
        - variable: query
          value_selector:
          - diag_input
          - query
        outputs:
          function:
            type: string
            children: null
          version:
            type: string
            children: null
          FTA_Query:
            type: string
            children: null
          FMECA_Query:
            type: string
            children: null
          RBD_Query:
            type: string
            children: null
          Fault_History_Query:
            type: string
            children: null
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: diag_FTA_Query
