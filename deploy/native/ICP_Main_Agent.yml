        x: 1640
        y: 580
      positionAbsolute:
        x: 2340
        y: 680
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: http-request
        title: execute
        method: post
        url: '{{#env.TOOL_SERVICE_URL#}}/internal/react/execute'
        authorization:
