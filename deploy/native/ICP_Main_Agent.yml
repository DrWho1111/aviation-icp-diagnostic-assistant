        y: 510
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 定位请求
        code_language: python3
        code: "import json\ndef main(input: str):\n try:p=json.loads(input)\n except\
          \ json.JSONDecodeError:p={'query':input}\n if isinstance(p,str):p={'query':p}\n\
          \ if not isinstance(p,dict) or not isinstance(p.get('query'),str) or not\
          \ p['query'].strip():raise ValueError('Nonempty diagnostic question required')\n\
          \ return {'body':json.dumps({'input':json.dumps({'query':p['query']},ensure_ascii=False)},ensure_ascii=False),'query':p['query']}\n"
        variables:
        - variable: input
          value_selector:
          - decision
          - diagnosis_input
        outputs:
          body:
            type: string
            children: null
          query:
            type: string
            children: null
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
