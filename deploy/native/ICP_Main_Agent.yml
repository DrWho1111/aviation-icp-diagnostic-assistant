    - id: diag_merge
      type: custom
      position:
        x: 3240
        y: 70
      positionAbsolute:
        x: 3940
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 合并四路实际结果
        code_language: python3
        code: "import json\ndef main(function: str, version: str, fta: str, fmeca:\
          \ str, rbd: str, history: str):\n names=['FTA_Query','FMECA_Query','RBD_Query','Fault_History_Query']\n\
          \ values=[]\n for body in [fta,fmeca,rbd,history]:\n  try:\n   v=json.loads(json.loads(body)['result'])\n\
          \   if not isinstance(v,dict) or v.get('status') not in ['ok','not_found','not_covered','error','needs_input']\
          \ or not isinstance(v.get('evidence'),list):raise ValueError('Invalid branch\
          \ shape')\n   if v['status']=='error' and not v.get('corpus_version'):v['corpus_version']=version\n\
          \   if v.get('corpus_version')!=version:raise ValueError('Knowledge version\
          \ differs')\n  except (ValueError,KeyError,TypeError):\n   v={'status':'error','data':[],'evidence':[],'missing_fields':[],'coverage':{},'error':'分支返回格式或知识版本校验失败','corpus_version':version}\n\
          \  values.append(v)\n failed=[n for n,v in zip(names,values) if v['status']=='error']\n\
          \ missing=[n for n,v in zip(names,values) if v['status']=='needs_input']\n\
          \ result={'status':'error' if failed else 'needs_input' if missing else\
          \ 'ok','data':{'function':json.loads(function),'branches':dict(zip(names,values))},\n\
          \  'evidence':list({e['id']:e for v in values for e in v['evidence']}.values()),'missing_fields':[],\n\
          \  'coverage':{n:v['status'] for n,v in zip(names,values)},'error':'、'.join(failed)\
          \ if failed else None,'corpus_version':version}\n return {'result':json.dumps(result,ensure_ascii=False)}\n"
        variables:
        - variable: function
          value_selector:
          - diag_arguments
          - function
        - variable: version
          value_selector:
          - diag_arguments
          - version
        - variable: fta
          value_selector:
          - diag_FTA_Query
          - body
        - variable: fmeca
          value_selector:
          - diag_FMECA_Query
          - body
        - variable: rbd
          value_selector:
          - diag_RBD_Query
          - body
        - variable: history
          value_selector:
          - diag_Fault_History_Query
          - body
        outputs:
          result:
            type: string
            children: null
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
