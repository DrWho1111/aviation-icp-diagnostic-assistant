app:
  name: ICP_Native_ReAct_Validation
  description: SYN-ICP-9000合成资料工具；需完成平台导入与真实联调
  mode: workflow
  icon: 🔎
  icon_background: '#EFF6FF'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: service-url
    name: TOOL_SERVICE_URL
    description: 后端内部工具地址
    selector:
    - env
    - TOOL_SERVICE_URL
    value: http://host.docker.internal:8000
    value_type: string
  - id: tool-token
    name: INTERNAL_TOOL_TOKEN
    description: 从本机.env填写，禁止提交或截图
    selector:
    - env
    - INTERNAL_TOOL_TOKEN
    value: ''
    value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 100
      positionAbsolute:
        x: 0
        y: 100
      width: 244
      height: 100
      data:
        type: start
        title: 输入
        desc: ''
        selected: false
        variables:
        - label: input
          variable: input
          type: paragraph
          required: true
          max_length: 16000
          options: []
      sourcePosition: right
      targetPosition: left
    - id: init
      type: custom
      position:
        x: 100
        y: 100
      positionAbsolute:
        x: 100
        y: 100
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 绑定应用任务
        code_language: python3
        code: "import json\ndef main(input: str):\n p=json.loads(input)\n return {'root':p['root_run_id'],'body':json.dumps({'input':json.dumps({'root_run_id':p['root_run_id']})})}\n"
        variables:
        - variable: input
          value_selector:
          - start
          - input
        outputs:
          root:
            type: string
            children: null
          body:
            type: string
            children: null
      sourcePosition: right
      targetPosition: left
    - id: loop
      type: custom
      position: &id001
        x: 700
        y: 100
      positionAbsolute: *id001
      width: 4900
      height: 860
      data:
        selected: false
        desc: ''
        type: loop
        title: 单工具ReAct循环（最多12轮）
        start_node_id: loop-start
        loop_count: 12
        logical_operator: and
        break_conditions:
        - variable_selector:
          - loop
          - done
          comparison_operator: is
          value: '1'
        loop_variables:
        - label: done
          var_type: string
          value_type: constant
          value: '0'
      sourcePosition: right
      targetPosition: left
    - id: loop-start
      type: custom
      position:
        x: 40
        y: 70
      positionAbsolute:
        x: 740
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: loop-start
        title: 本轮开始
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: plan
      type: custom
      position:
        x: 360
        y: 70
      positionAbsolute:
        x: 1060
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: http-request
        title: plan
        method: post
        url: '{{#env.TOOL_SERVICE_URL#}}/internal/react/plan'
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type:application/json

          Authorization:Bearer {{#env.INTERNAL_TOOL_TOKEN#}}'
        params: ''
        body:
          type: raw-text
          data:
          - id: body
            key: ''
            type: text
            value: '{{#init.body#}}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 30
        retry_config:
          retry_enabled: true
          max_retries: 1
          retry_interval: 200
        variables: []
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: decision
      type: custom
      position:
        x: 680
        y: 70
      positionAbsolute:
        x: 1380
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 读取经校验的单工具决策
        code_language: python3
        code: "import json\ndef main(body: str):\n p=json.loads(json.loads(body)['result'])\n\
          \ return {'kind':p['kind'],'action_id':p.get('action_id',''),'diagnosis_input':p.get('diagnosis_input','{}'),'note':p.get('note','')}\n"
        variables:
        - variable: body
          value_selector:
          - plan
          - body
        outputs:
          kind:
            type: string
            children: null
          action_id:
            type: string
            children: null
          diagnosis_input:
            type: string
            children: null
          note:
            type: string
            children: null
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: dispatch
      type: custom
      position:
        x: 1000
        y: 70
      positionAbsolute:
        x: 1700
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: if-else
        title: 只执行本轮相关动作
        cases:
        - case_id: done
          logical_operator: and
          conditions:
          - variable_selector:
            - decision
            - kind
            comparison_operator: is
            value: done
        - case_id: execute
          logical_operator: and
          conditions:
          - variable_selector:
            - decision
            - kind
            comparison_operator: is
            value: execute
        - case_id: diagnosis
          logical_operator: and
          conditions:
          - variable_selector:
            - decision
            - kind
            comparison_operator: is
            value: diagnosis
        - case_id: input
          logical_operator: and
          conditions:
          - variable_selector:
            - decision
            - kind
            comparison_operator: is
            value: input
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: action_body
      type: custom
      position:
        x: 1320
        y: 70
      positionAbsolute:
        x: 2020
        y: 170
      width: 244
      height: 100
      data:
        selected: false
        desc: ''
        type: code
        title: 绑定本轮动作
        code_language: python3
        code: 'import json

          def main(root: str, action: str):return {''body'':json.dumps({''input'':json.dumps({''root_run_id'':root,''action_id'':action})})}

          '
        variables:
        - variable: root
          value_selector:
          - init
          - root
        - variable: action
          value_selector:
          - decision
          - action_id
        outputs:
          body:
            type: string
            children: null
        loop_id: loop
      sourcePosition: right
      targetPosition: left
      parentId: loop
      extent: parent
    - id: execute
