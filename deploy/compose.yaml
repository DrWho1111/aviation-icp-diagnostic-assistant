name: icp-workbench
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: icp
      POSTGRES_USER: icp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icp -d icp"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the private .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j:/data"]
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://icp:${POSTGRES_PASSWORD}@postgres:5432/icp
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      READ_KB_FROM_POSTGRES: "true"
      GRAPH_BACKEND: neo4j
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      DIFY_BASE_URL: http://host.docker.internal:8081/v1
      RAGFLOW_BASE_URL: http://host.docker.internal:9380
      DIFY_TOOL_KEYS_FILE: /run/secrets/dify_tool_keys
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["runtime:/app/data/runtime"]
    secrets: [dify_tool_keys]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_started}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      retries: 12
    restart: unless-stopped
    command: ["python", "scripts/container_start.py"]
volumes:
  postgres:
  neo4j:
  runtime:
secrets:
  dify_tool_keys:
    file: ../.secrets/dify-tools.json

